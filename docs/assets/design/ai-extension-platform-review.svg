<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="windowBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="sidebarBackground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3fb"/>
      <stop offset="1" stop-color="#e3edf6"/>
    </linearGradient>
    <filter id="windowShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .app-title { font: 700 22px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; fill: #1f2937; }
      .page-title { font: 750 34px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; fill: #111827; }
      .section-title { font: 700 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #1f2937; }
      .row-title { font: 650 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #1f2937; }
      .body { font: 500 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #475569; }
      .caption { font: 550 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #64748b; }
      .mono { font: 550 12px ui-monospace, "SFMono-Regular", Menlo, monospace; fill: #475569; }
      .nav { font: 600 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #334155; }
      .button { font: 650 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #ffffff; }
      .button-secondary { font: 650 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #334155; }
      .chip { font: 650 11px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      .divider { stroke: #d5dde7; stroke-width: 1; }
      .soft-divider { stroke: #e5eaf0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#dce4ec"/>
  <text x="70" y="64" class="page-title">AI 扩展平台 UI 评审稿</text>
  <text x="70" y="94" class="body">仅供确认信息架构与交互方向。确认后再实施 SwiftUI；Prompt、Skill、MCP 共用同一套来源、风险、权限与 Harness 状态。</text>

  <g transform="translate(70 130)" filter="url(#windowShadow)">
    <rect width="1660" height="910" rx="20" fill="url(#windowBackground)"/>

    <!-- Window chrome -->
    <circle cx="34" cy="31" r="7" fill="#ff5f57"/>
    <circle cx="58" cy="31" r="7" fill="#febc2e"/>
    <circle cx="82" cy="31" r="7" fill="#28c840"/>
    <line x1="0" y1="62" x2="1660" y2="62" class="divider"/>

    <!-- Primary app sidebar -->
    <path d="M0 20 Q0 0 20 0 H252 V910 H20 Q0 910 0 890 Z" fill="url(#sidebarBackground)"/>
    <line x1="252" y1="0" x2="252" y2="910" class="divider"/>
    <text x="32" y="102" class="app-title">Sci-Station</text>
    <g transform="translate(18 132)">
      <rect width="216" height="38" rx="7" fill="transparent"/>
      <text x="14" y="24" class="nav">⌂　首页</text>
      <text x="14" y="72" class="nav">▱　项目</text>
      <text x="14" y="120" class="nav">▤　论文库</text>
      <text x="14" y="168" class="nav">□　日历</text>

        <rect x="397" y="18" width="90" height="25" rx="12" fill="#fef3c7"/>
        <text x="410" y="35" class="chip" fill="#a16207">受限信任</text>
        <circle cx="466" cy="64" r="10" fill="#2563eb"/>
        <circle cx="470" cy="64" r="6" fill="#ffffff"/>
      </g>

      <text x="0" y="340" class="caption">未启用 · 2</text>

      <g transform="translate(0 358)">
        <rect width="505" height="88" rx="8" fill="#fffaf0" stroke="#f4cf8c"/>

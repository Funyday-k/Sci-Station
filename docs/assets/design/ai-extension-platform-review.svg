    <rect x="496" y="63" width="565" height="847" fill="#ffffff"/>
    <line x1="1061" y1="63" x2="1061" y2="910" class="divider"/>
    <text x="526" y="110" class="page-title">Skills</text>
    <text x="526" y="140" class="body">安装、启用和检查 Agent 能力。工作区 Skill 默认不受信任。</text>

    <rect x="526" y="166" width="382" height="38" rx="7" fill="#f1f5f9" stroke="#d9e1ea"/>
    <text x="542" y="190" class="caption">⌕　搜索 Skill、能力或工具</text>
    <rect x="920" y="166" width="111" height="38" rx="7" fill="#2563eb"/>

      <text x="14" y="264" class="nav">⚙　设置</text>
    </g>
    <text x="32" y="850" class="caption">ResearchWorkspace</text>
    <text x="32" y="875" class="caption">8/15 modules enabled</text>

    <!-- Extension section navigation -->
    <rect x="253" y="63" width="242" height="847" fill="#f8fafc"/>
    <line x1="495" y1="63" x2="495" y2="910" class="divider"/>
    <text x="278" y="106" class="section-title">AI 扩展</text>
    <text x="278" y="134" class="caption">工作区能力与安全边界</text>

    <g transform="translate(268 162)">
      <rect width="216" height="42" rx="7" fill="transparent"/>
      <text x="14" y="26" class="nav">⌘　Prompt Library</text>
      <rect y="48" width="216" height="42" rx="7" fill="#dceafe"/>
      <text x="14" y="74" class="nav" fill="#1756a9">◇　Skills</text>
      <text x="14" y="122" class="nav">⇄　MCP Servers</text>
      <text x="14" y="170" class="nav">✓　Harness</text>
      <line x1="12" y1="198" x2="204" y2="198" class="soft-divider"/>
      <text x="14" y="230" class="caption">运行边界</text>
      <text x="14" y="265" class="nav">◉　Runtime</text>
      <text x="14" y="309" class="nav">⌁　Evidence Index</text>
      <text x="14" y="353" class="nav">▥　Run Audit</text>
    </g>

    <g transform="translate(274 760)">
      <text x="0" y="0" class="caption">EXTENSION HEALTH</text>
      <circle cx="7" cy="28" r="5" fill="#16a34a"/>
      <text x="20" y="33" class="body">12 可用</text>
      <circle cx="7" cy="58" r="5" fill="#d97706"/>
      <text x="20" y="63" class="body">2 需要审阅</text>
      <circle cx="7" cy="88" r="5" fill="#dc2626"/>
      <text x="20" y="93" class="body">1 测试失败</text>
    </g>


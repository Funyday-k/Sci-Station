    <text x="1092" y="225" class="body">论文阅读、方法提取、关键公式、局限分析</text>
    <rect x="1092" y="244" width="238" height="34" rx="6" fill="#ffffff" stroke="#d9e1ea"/>
    <text x="1106" y="266" class="mono">capability: paper_reading</text>
    <rect x="1342" y="244" width="196" height="34" rx="6" fill="#ffffff" stroke="#d9e1ea"/>
    <text x="1356" y="266" class="mono">risk: read_only</text>

    <text x="1092" y="322" class="section-title">允许工具</text>
    <g transform="translate(1092 340)">
      <rect width="260" height="34" rx="6" fill="#ffffff" stroke="#d9e1ea"/>
      <text x="14" y="22" class="mono">search_library_papers</text>
      <rect x="274" width="238" height="34" rx="6" fill="#ffffff" stroke="#d9e1ea"/>
      <text x="288" y="22" class="mono">read_paper_markdown</text>
      <rect y="44" width="260" height="34" rx="6" fill="#ffffff" stroke="#d9e1ea"/>
      <text x="14" y="66" class="mono">search_workspace_text</text>
      <rect x="274" y="44" width="238" height="34" rx="6" fill="#ffffff" stroke="#d9e1ea"/>
      <text x="288" y="66" class="mono">read_workspace_section</text>
    </g>

    <text x="1092" y="455" class="section-title">依赖</text>
    <text x="1092" y="483" class="body">Resources：paper.md、PDF text、Wiki</text>
    <text x="1092" y="509" class="body">MCP：无　　Network：不需要　　Write：不允许</text>

    <text x="1092" y="559" class="section-title">Harness 状态</text>
    <g transform="translate(1092 577)">
      <circle cx="8" cy="9" r="6" fill="#16a34a"/>
      <text x="24" y="14" class="body">Manifest contract</text>
      <text x="430" y="14" class="caption">通过 · 12:41</text>
      <circle cx="8" cy="43" r="6" fill="#16a34a"/>
      <text x="24" y="48" class="body">Secret scan</text>
      <text x="430" y="48" class="caption">通过 · 12:41</text>
      <circle cx="8" cy="77" r="6" fill="#16a34a"/>
      <text x="24" y="82" class="body">Allowed-tool boundary</text>
      <text x="430" y="82" class="caption">通过 · 12:41</text>
      <circle cx="8" cy="111" r="6" fill="#d97706"/>
      <text x="24" y="116" class="body">Golden workspace evaluation</text>
      <text x="430" y="116" class="caption">尚未运行</text>
    </g>

    <text x="1092" y="742" class="section-title">启用策略</text>
    <rect x="1092" y="760" width="538" height="66" rx="8" fill="#ffffff" stroke="#d9e1ea"/>
    <text x="1108" y="786" class="body">自动匹配请求，但只能收窄当前 Tool Set。</text>
    <text x="1108" y="808" class="caption">Skill 不能覆盖审批、工作区边界或用户禁用的工具。</text>

    <rect x="1092" y="847" width="118" height="38" rx="7" fill="#2563eb"/>
    <text x="1126" y="871" class="button">已启用</text>
    <rect x="1222" y="847" width="118" height="38" rx="7" fill="#ffffff" stroke="#ccd6e1"/>
    <text x="1253" y="871" class="button-secondary">查看文件</text>
    <rect x="1352" y="847" width="142" height="38" rx="7" fill="#ffffff" stroke="#ccd6e1"/>
    <text x="1382" y="871" class="button-secondary">运行 Harness</text>

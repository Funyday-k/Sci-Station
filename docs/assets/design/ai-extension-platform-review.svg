        <rect x="397" y="18" width="90" height="25" rx="12" fill="#fee2e2"/>
        <text x="409" y="35" class="chip" fill="#b91c1c">未受信任</text>
        <circle cx="466" cy="64" r="10" fill="#cbd5e1"/>
      </g>

      <g transform="translate(0 456)">
        <rect width="505" height="88" rx="8" fill="#ffffff" stroke="#e1e7ee"/>
        <rect x="14" y="15" width="36" height="36" rx="8" fill="#f1f5f9"/>
        <text x="25" y="39" font-size="18" fill="#64748b">⌘</text>
        <text x="64" y="29" class="row-title">related-work-matrix</text>
        <text x="64" y="51" class="caption">Bundled · read-only · v0.5.0</text>
        <text x="64" y="72" class="caption">等待 Evidence Index 后启用</text>
        <rect x="407" y="18" width="80" height="25" rx="12" fill="#f1f5f9"/>
        <text x="421" y="35" class="chip" fill="#64748b">依赖缺失</text>
        <circle cx="466" cy="64" r="10" fill="#cbd5e1"/>
      </g>
    </g>

    <!-- Inspector -->
    <rect x="1062" y="63" width="598" height="847" fill="#f8fafc"/>
    <text x="1092" y="108" class="section-title">paper-reading</text>

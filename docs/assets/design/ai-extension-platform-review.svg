        <rect x="422" y="18" width="65" height="25" rx="12" fill="#dcfce7"/>
        <text x="437" y="35" class="chip" fill="#15803d">可信</text>
        <circle cx="466" cy="64" r="10" fill="#2563eb"/>
        <circle cx="470" cy="64" r="6" fill="#ffffff"/>
      </g>

      <g transform="translate(0 116)">
        <rect width="505" height="88" rx="8" fill="#ffffff" stroke="#e1e7ee"/>
        <rect x="14" y="15" width="36" height="36" rx="8" fill="#e7f7ee"/>
        <text x="25" y="39" font-size="18" fill="#16844a">⌁</text>
        <text x="64" y="29" class="row-title">citation-auditor</text>
        <text x="64" y="51" class="caption">User global · read-only · v0.8.1</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#28415f" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; fill: #17202a; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #5b6775; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #1f2937; }
      .note { font: 500 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #64748b; }
      .tiny { font: 600 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; fill: #64748b; }
      .cell { fill: rgba(255,255,255,0.58); stroke: rgba(62,80,105,0.18); stroke-width: 1.2; stroke-dasharray: 7 7; }
      .chip { fill: rgba(255,255,255,0.66); stroke: rgba(62,80,105,0.16); stroke-width: 1; }
      .widget { stroke: rgba(255,255,255,0.78); stroke-width: 1.4; filter: url(#softShadow); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="70" y="82" class="title">Sci-Station 小组件尺寸矩阵</text>
  <text x="70" y="118" class="subtitle">单位按“高×宽”定义；基础 1×1 是圆角正方形；桌面最大网格固定为 4 列，不再使用 3 列分割。</text>

  <g transform="translate(70 165)">
    <rect x="0" y="0" width="1260" height="660" rx="30" fill="rgba(255,255,255,0.46)" stroke="rgba(62,80,105,0.14)"/>
    <text x="36" y="48" class="label">4 列单位网格</text>
    <text x="36" y="78" class="note">每个 unit 的宽度由容器提交；row height = unit width，所以 1×1 始终是正方形。</text>

    <g transform="translate(38 115)">
      <g>
        <rect x="0" y="0" width="86" height="86" rx="18" class="cell"/>
        <rect x="102" y="0" width="86" height="86" rx="18" class="cell"/>
        <rect x="204" y="0" width="86" height="86" rx="18" class="cell"/>
        <rect x="306" y="0" width="86" height="86" rx="18" class="cell"/>
        <rect x="0" y="102" width="86" height="86" rx="18" class="cell"/>
        <rect x="102" y="102" width="86" height="86" rx="18" class="cell"/>
        <rect x="204" y="102" width="86" height="86" rx="18" class="cell"/>
        <rect x="306" y="102" width="86" height="86" rx="18" class="cell"/>
        <rect x="0" y="204" width="86" height="86" rx="18" class="cell"/>
        <rect x="102" y="204" width="86" height="86" rx="18" class="cell"/>
        <rect x="204" y="204" width="86" height="86" rx="18" class="cell"/>
        <rect x="306" y="204" width="86" height="86" rx="18" class="cell"/>
        <rect x="0" y="306" width="86" height="86" rx="18" class="cell"/>
        <rect x="102" y="306" width="86" height="86" rx="18" class="cell"/>
        <rect x="204" y="306" width="86" height="86" rx="18" class="cell"/>
        <rect x="306" y="306" width="86" height="86" rx="18" class="cell"/>
      </g>
      <text x="0" y="430" class="tiny">示意：4 columns × N rows，组件按 skyline/gravity 落位。</text>
    </g>

    <g transform="translate(520 112)">
      <g transform="translate(0 0)">
        <rect width="180" height="150" rx="22" class="chip"/>
        <rect x="28" y="28" width="72" height="72" rx="18" fill="#f59e0b" class="widget"/>
        <text x="28" y="122" class="label">small</text>
        <text x="104" y="122" class="note">1×1 小</text>
      </g>

      <g transform="translate(220 0)">
        <rect width="260" height="150" rx="22" class="chip"/>
        <rect x="28" y="28" width="160" height="72" rx="18" fill="#2563eb" class="widget"/>
        <text x="28" y="122" class="label">wide</text>
        <text x="94" y="122" class="note">1×2 宽</text>
      </g>

      <g transform="translate(530 0)">
        <rect width="180" height="250" rx="22" class="chip"/>
        <rect x="28" y="28" width="72" height="160" rx="18" fill="#14b8a6" class="widget"/>
        <text x="28" y="220" class="label">tall</text>
        <text x="86" y="220" class="note">2×1 竖</text>
      </g>

      <g transform="translate(0 190)">
        <rect width="260" height="250" rx="22" class="chip"/>
        <rect x="28" y="28" width="160" height="160" rx="22" fill="#8b5cf6" class="widget"/>
        <text x="28" y="220" class="label">medium</text>
        <text x="124" y="220" class="note">2×2 中</text>
      </g>

      <g transform="translate(310 190)">
        <rect width="360" height="360" rx="26" class="chip"/>
        <rect x="28" y="28" width="262" height="262" rx="28" fill="#22c55e" class="widget"/>
        <text x="28" y="322" class="label">large</text>
        <text x="104" y="322" class="note">3×3 大，最大信息密度</text>
      </g>
    </g>

    <g transform="translate(38 560)">
      <rect x="0" y="0" width="1180" height="64" rx="20" fill="rgba(15,23,42,0.06)"/>
      <text x="22" y="26" class="tiny">信息密度规则</text>
      <text x="22" y="48" class="note">1×1 主指标；1×2 横向摘要；2×1 竖向短列表；2×2 默认工作态；3×3 完整内容。每个 widget 必须为五种尺寸提供专门布局。</text>
    </g>
  </g>
</svg>

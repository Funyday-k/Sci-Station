<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sci-Station · 科研工作台</title>
  <link rel="icon" href="/static/roundtable-mark.png">
  <script defer src="/static/workspace-nav.js"></script>
  <script src="/static/appearance.js"></script>
  <link rel="stylesheet" href="/static/research-vendor/katex.min.css">
  <link rel="stylesheet" href="/static/research.css">
  <link rel="stylesheet" href="/static/research-dashboard.css">
  <script defer src="/static/ui-icons.js"></script>
  <script defer src="/static/research-vendor/marked.min.js"></script>
  <script defer src="/static/research-vendor/dompurify.min.js"></script>
  <script defer src="/static/research-vendor/katex.min.js"></script>
  <script defer src="/static/research-vendor/auto-render.min.js"></script>
  <script defer src="/static/research-graph.js"></script>
  <script defer src="/static/research-dashboard.js"></script>
  <script defer src="/static/research.js"></script>
  <script defer src="/static/research-forms.js"></script>
  <script defer src="/static/research-materials.js"></script>
  <script defer src="/static/research-library.js"></script>
<link rel="stylesheet" href="/static/workspace-nav.css">
  </head>

<body>
  <div id="shell">
    <aside id="sidebar" aria-label="工作区导航">
      <a class="brand" href="/research"><img src="/static/roundtable-mark.png" width="36" height="36"
          alt=""><span>Sci-Station</span></a>
      <nav data-workspace-nav aria-label="工作区导航"></nav>
      <div class="project-heading"><strong>我的项目</strong><button type="button" id="new-project" class="icon" aria-label="新建项目"
          title="新建项目">＋</button></div>
      <nav id="projectnav" aria-label="科研项目"></nav>
    </aside>
    <div id="workarea">
      <header class="topbar">
        <button type="button" id="nav-toggle" class="icon" title="切换导航" aria-label="切换导航" aria-controls="sidebar"><span
            data-icon="sidebar"></span></button>
        <div id="crumb"><span>科研工作台</span></div>
        <button id="search-open" class="search-open"><span data-icon="search"></span><span>搜索工作区</span><kbd>⌘ K</kbd></button>
      </header>
      <nav id="project-modules" aria-label="项目功能" hidden></nav>
      <main id="main" tabindex="-1" aria-busy="true">
        <p class="initial">正在读取工作区…</p>
      </main>
    </div>
  </div>
  <div id="toast" role="status" hidden></div>
  <dialog id="modal" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2><button id="modal-close" class="icon" type="button" title="关闭" aria-label="关闭"><span
          data-icon="close"></span></button>
    </div>
    <div id="dialog-content"></div>
  </dialog>
</body>

</html>

<link rel="stylesheet" href="/static/scientific-markdown.css">
  <link rel="stylesheet" href="/static/research.css">
  <link rel="stylesheet" href="/static/research-dashboard.css">
  <script defer src="/static/ui-icons.js"></script>
  <script defer src="/static/research-vendor/marked.min.js"></script>
  <script defer src="/static/research-vendor/dompurify.min.js"></script>
  <script defer src="/static/research-vendor/katex.min.js"></script>
  <script defer src="/static/scientific-markdown.js"></script>
  <script defer src="/static/research-graph.js"></script>
  <script defer src="/static/research-inspire-graph.js"></script>
  <script defer src="/static/research-dashboard.js"></script>
  <script defer src="/static/research.js"></script>

{{define "content"}}
<div id="shell">
    <aside id="sidebar" aria-label="工作区导航" data-l10n-aria-label="workspaceNavigation">

      <div class="project-heading"><strong data-l10n-text="myProjects">我的项目</strong><button type="button" id="new-project" class="icon" aria-label="新建项目"
          title="新建项目" data-l10n-title="toolbarNewProject" data-l10n-aria-label="toolbarNewProject">＋</button></div>
      <nav id="projectnav" aria-label="科研项目" data-l10n-aria-label="projectNavigation"></nav>
    </aside>
    <div id="workarea">
      <header class="topbar">
        <button type="button" id="nav-toggle" class="icon" title="切换导航" aria-label="切换导航" aria-controls="sidebar" data-l10n-title="toggleNavigation" data-l10n-aria-label="toggleNavigation"><span
            data-icon="sidebar"></span></button>
        <div id="crumb"><span data-l10n-text="sidebarResearchShell">科研工作台</span></div>
        <button id="search-open" class="search-open"><span data-icon="search"></span><span data-l10n-text="searchWorkspace">搜索工作区</span><kbd>⌘ K</kbd></button>
      </header>
      <nav id="project-modules" aria-label="项目功能" hidden data-l10n-aria-label="projectModules"></nav>
      <main id="main" tabindex="-1" aria-busy="true">
        <p class="initial" data-l10n-text="loadingWorkspace">正在读取工作区…</p>
      </main>
    </div>
  </div>
  <div id="toast" role="status" hidden></div>
  <dialog id="modal" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2><button id="modal-close" class="icon" type="button" title="关闭" aria-label="关闭" data-l10n-title="close" data-l10n-aria-label="close"><span
          data-icon="close"></span></button>
    </div>
    <div id="dialog-content"></div>
  </dialog>
{{end}}

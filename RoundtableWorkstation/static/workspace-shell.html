<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{.Title}} · Sci-Station</title>
  <link rel="icon" href="/static/roundtable-mark.png">
  <script src="/static/appearance.js"></script>
  <script defer src="/static/interface-language.js"></script>
  <script defer src="/static/research-modules.js"></script>
  <script defer src="/static/workspace-nav.js"></script>
  {{template "head" .}}
  <link rel="stylesheet" href="/static/workspace-nav.css">
</head>
<body data-workspace-surface="{{.Surface}}">
  <div class="workspace-bar">
    <a class="workspace-brand" href="/research" aria-label="Sci-Station"><img src="/static/roundtable-mark.png" width="25" height="25" alt=""><span>Sci-Station</span></a>
    <div class="workspace-history">
      <button type="button" data-command="back" aria-label="后退" data-en-aria-label="Back" title="后退">‹</button>
      <button type="button" data-command="forward" aria-label="前进" data-en-aria-label="Forward" title="前进">›</button>
    </div>
    <nav data-workspace-nav aria-label="工作区导航" data-en-aria-label="Workspace navigation"></nav>
    <a data-project-back hidden href="/research">返回当前项目</a>
    {{if .Desktop}}<details class="workspace-roots">
      <summary data-en="Workspace">工作区</summary>
      <div><button type="button" data-root-action="open" data-en="Open workspace…">打开工作区…</button><button type="button" data-root-action="create" data-en="Create workspace…">创建工作区…</button></div>
    </details>{{end}}
  </div>
  {{template "content" .}}
</body>
</html>

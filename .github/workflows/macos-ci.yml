name: macOS CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject generated artifacts and oversized tracked files
        run: Tools/scripts/check-repository-hygiene.sh

  core-tests:
    name: Swift core tests
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Report Xcode toolchain
        run: xcodebuild -version
      - name: Run Swift Testing suite
        run: swift test

  app-build:
    name: Apple Silicon app build
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Report Xcode toolchain
        run: xcodebuild -version
      - name: Build unsigned arm64 Debug app
        run: >-
          xcodebuild
          -project Sci-Station.xcodeproj
          -scheme Sci-Station
          -configuration Debug
          -destination 'generic/platform=macOS'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

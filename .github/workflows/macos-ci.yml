name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Reject generated artifacts and oversized tracked files
        run: Tools/scripts/check-repository-hygiene.sh
      - name: Check documentation, version sources, and governance
        run: |
          python3 Tools/scripts/check-docs-hygiene.py
          python3 Tools/scripts/check-version-consistency.py
          python3 -m unittest discover -s Tools/tests -v
      - name: Validate release scripts and historical build numbers
        run: |
          for script in Tools/scripts/*.sh packaging/macos/*.sh; do
            bash -n "$script"
          done
          Tools/scripts/test-release-build-number.sh

  traceability:
    name: Change traceability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Require a linked requirement or decision
        run: python3 Tools/scripts/check-pr-traceability.py

  workstation:
    name: Desktop tests and macOS build
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check Go formatting and vet sources
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet -tags nogui ./...
      - name: Run Go race tests and enforce coverage
        run: |
          go test -race -tags nogui -coverprofile="$RUNNER_TEMP/go-coverage.out" ./...
          Tools/scripts/check-go-coverage.sh "$RUNNER_TEMP/go-coverage.out"
      - name: Upload Go coverage profile
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-go-coverage
          if-no-files-found: error
          path: ${{ runner.temp }}/go-coverage.out
      - name: Run frontend and native bridge tests
        run: node --test tests/*.test.cjs
      - name: Build the signed arm64 desktop bundle
        run: make app APP_OUTPUT="$RUNNER_TEMP/Sci-Station.app"
      - name: Verify desktop bundle and deployment target
        run: make verify APP_OUTPUT="$RUNNER_TEMP/Sci-Station.app"
      - name: Exercise shutdown and relaunch on macOS
        run: python3 tests/macos-close-smoke.py "$RUNNER_TEMP/Sci-Station.app"
      - name: Exercise first launch, data folder selection and recovery
        run: node tests/workstation-storage-smoke.cjs "$RUNNER_TEMP/Sci-Station.app"
      - name: Review a paper excerpt and reopen its source in WKWebView
        run: node tests/workstation-workflow-smoke.cjs --native "$RUNNER_TEMP/Sci-Station.app"
      - name: Exercise workbench navigation, editing and appearance in WKWebView
        run: node tests/workstation-workbench-smoke.cjs "$RUNNER_TEMP/Sci-Station.app" "$RUNNER_TEMP/workbench-ui" --short-display
      - name: Upload workbench views when an interaction fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: workbench-interactions
          path: ${{ runner.temp }}/workbench-ui
          if-no-files-found: ignore
      - name: Exercise native menu navigation and cross-root access revocation
        run: node tests/workstation-native-menu-smoke.cjs "$RUNNER_TEMP/Sci-Station.app"
      - name: Package the tested desktop build
        id: workstation-candidate
        env:
          SCI_STATION_RELEASE_BUILD_DIR: ${{ runner.temp }}/workstation-packages
        run: Tools/scripts/package-release.sh --app "$RUNNER_TEMP/Sci-Station.app"
      - name: Package the lower-build-number rollback fixture from this checkout
        id: workstation-prior
        env:
          SCI_STATION_RELEASE_BUILD_DIR: ${{ runner.temp }}/workstation-packages
          SCI_STATION_BUILD_NUMBER: "1"
        run: Tools/scripts/package-release.sh
      - name: Upload the non-release candidate and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workstation-candidate-containers
          if-no-files-found: error
          retention-days: 3
          path: |
            ${{ steps.workstation-candidate.outputs.zip_path }}
            ${{ steps.workstation-candidate.outputs.dmg_path }}
            ${{ steps.workstation-candidate.outputs.zip_checksum_path }}
            ${{ steps.workstation-candidate.outputs.dmg_checksum_path }}
      - name: Upload the signed rollback fixture and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workstation-prior-fixture-containers
          if-no-files-found: error
          retention-days: 3
          path: |
            ${{ steps.workstation-prior.outputs.zip_path }}
            ${{ steps.workstation-prior.outputs.dmg_path }}
            ${{ steps.workstation-prior.outputs.zip_checksum_path }}
            ${{ steps.workstation-prior.outputs.dmg_checksum_path }}

  workstation-minimum-macos:
    name: Desktop install, upgrade, and rollback on macOS 15
    needs: workstation
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: workstation-candidate-containers
          path: ${{ runner.temp }}/workstation-candidate
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: workstation-prior-fixture-containers
          path: ${{ runner.temp }}/workstation-prior
      - name: Exercise the installed native app from both archives on Apple Silicon
        shell: bash
        env:
          SCI_STATION_INSTALLED_UI_RESULTS_DIR: ${{ runner.temp }}/installed-app-ui
        run: |
          set -euo pipefail
          sw_vers
          [[ "$(sw_vers -productVersion)" == 15.* && "$(uname -m)" == arm64 ]]
          export SCI_STATION_BUILD_NUMBER="$(cat BUILD_NUMBER)"
          for extension in zip dmg; do
            previous=("$RUNNER_TEMP/workstation-prior/"*."$extension")
            candidate=("$RUNNER_TEMP/workstation-candidate/"*."$extension")
            [[ "${#previous[@]}" -eq 1 && -f "${previous[0]}" && "${#candidate[@]}" -eq 1 && -f "${candidate[0]}" ]]
            Tools/scripts/test-release-install.sh --native-ui "${previous[0]}" "${candidate[0]}"
          done
      - name: Upload installed-app UI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-app-ui-diagnostics
          path: ${{ runner.temp }}/installed-app-ui
          retention-days: 3
          if-no-files-found: ignore

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs: [repository-hygiene, traceability, workstation, workstation-minimum-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              print("Required jobs did not succeed: " + ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          print("All required CI gates passed.")
          PY

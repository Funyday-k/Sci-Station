name: Public Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.2.0)
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-package:
    name: Build and verify certificate-free artifacts
    runs-on: macos-26
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate release tag, source version, and increasing build number
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$(git rev-parse HEAD)" ]]
          git merge-base --is-ancestor HEAD origin/main
          python3 Tools/scripts/check-version-consistency.py --tag "$RELEASE_TAG"
          build_number="$(cat BUILD_NUMBER)"
          Tools/scripts/check-release-build-number.sh "$RELEASE_TAG" "$build_number"
          echo "build_number=$build_number" >>"$GITHUB_OUTPUT"

      - name: Run governance and build-number gates
        run: |
          Tools/scripts/check-repository-hygiene.sh
          python3 Tools/scripts/check-docs-hygiene.py
          python3 -m unittest discover -s Tools/tests -v
          Tools/scripts/test-release-build-number.sh

      - name: Check Go formatting, race safety, and coverage
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go vet -tags nogui ./...
          go test -race -tags nogui -coverprofile="$RUNNER_TEMP/go-coverage.out" ./...
          Tools/scripts/check-go-coverage.sh "$RUNNER_TEMP/go-coverage.out"

      - name: Run frontend and native bridge tests
        run: node --test tests/*.test.cjs

      - name: Build ad-hoc signed release artifacts
        id: package
        env:
          SCI_STATION_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SCI_STATION_RELEASE_BUILD_DIR: ${{ runner.temp }}/release-packages
        run: Tools/scripts/package-release.sh

      - name: Verify native workflows on the packaged build
        env:
          APP_PATH: ${{ steps.package.outputs.app_path }}
          SCI_STATION_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          Tools/scripts/verify-release.sh "$APP_PATH"
          python3 tests/macos-close-smoke.py "$APP_PATH"
          node tests/workstation-workflow-smoke.cjs --native "$APP_PATH"
          node tests/workstation-native-menu-smoke.cjs "$APP_PATH"

      - name: Package the lower-build-number rollback fixture from this checkout
        id: prior
        env:
          SCI_STATION_BUILD_NUMBER: "1"
          SCI_STATION_RELEASE_BUILD_DIR: ${{ runner.temp }}/release-packages
        run: Tools/scripts/package-release.sh

      - name: Upload rollback fixture and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sci-station-release-rollback-fixture
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ steps.prior.outputs.dmg_path }}
            ${{ steps.prior.outputs.dmg_checksum_path }}
            ${{ steps.prior.outputs.zip_path }}
            ${{ steps.prior.outputs.zip_checksum_path }}

      - name: Upload release artifacts to workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.dmg_path }}
            ${{ steps.package.outputs.dmg_checksum_path }}
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.zip_checksum_path }}

  minimum-macos-gate:
    name: Verify final ZIP and DMG on macOS 15
    needs: release-package
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SCI_STATION_BUILD_NUMBER: ${{ needs.release-package.outputs.build_number }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download certificate-free release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          path: release-artifacts

      - name: Download the rollback fixture
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: sci-station-release-rollback-fixture
          path: rollback-fixture

      - name: Verify checksums, installed native UI, upgrade, and rollback
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          [[ "$(sw_vers -productVersion)" == 15.* && "$(uname -m)" == arm64 ]]
          for extension in zip dmg; do
            previous=(rollback-fixture/*."$extension")
            candidate=(release-artifacts/*."$extension")
            [[ "${#previous[@]}" -eq 1 && -f "${previous[0]}" && "${#candidate[@]}" -eq 1 && -f "${candidate[0]}" ]]
            Tools/scripts/test-release-install.sh --native-ui "${previous[0]}" "${candidate[0]}"
          done

  provenance:
    name: Attest gated release provenance
    needs: [release-package, minimum-macos-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download gated release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          path: release-artifacts

      - name: Verify artifact checksums before attestation
        shell: bash
        run: |
          set -euo pipefail
          checksum_count="$(find release-artifacts -type f -name '*.sha256' | wc -l | tr -d ' ')"
          [[ "$checksum_count" == "2" ]]
          while IFS= read -r checksum_path; do
            (
              cd "$(dirname "$checksum_path")"
              shasum -a 256 -c "$(basename "$checksum_path")"
            )
          done < <(find release-artifacts -type f -name '*.sha256' -print)

      - name: Create signed build provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.dmg
            release-artifacts/*.zip

  publish:
    name: Publish GitHub Release
    needs: [release-package, minimum-macos-gate, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRERELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
    steps:
      - name: Download gated release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          path: release-artifacts

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifacts=()
          while IFS= read -r artifact; do
            artifacts+=("$artifact")
          done < <(find release-artifacts -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.sha256' \) \
            -print | sort)
          [[ "${#artifacts[@]}" -eq 4 ]]
          release_notes="Certificate-free macOS distribution. The app is ad-hoc signed and is not Apple-notarized. On first launch macOS may require explicit approval in Privacy & Security. Verify the published SHA-256 or GitHub provenance before opening."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $RELEASE_TAG. Use a new tag to publish a new build." >&2
            exit 1
          fi
          release_args=(--verify-tag --generate-notes --title "Sci-Station ${RELEASE_TAG#v}" --notes "$release_notes")
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${artifacts[@]}" "${release_args[@]}"

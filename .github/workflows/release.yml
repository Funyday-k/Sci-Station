name: Public Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.2.0)
        required: true
        type: string
      build_number:
        description: Optional CFBundleVersion override
        required: false
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-package:
    name: Build and verify certificate-free artifacts
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AgentRuntime/pyproject.toml

      - name: Validate release tag and project version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git describe --tags --exact-match)" == "$RELEASE_TAG" ]]
          git merge-base --is-ancestor HEAD origin/main
          python3 Tools/scripts/check-version-consistency.py --tag "$RELEASE_TAG"
          project_version="$(xcodebuild -project Sci-Station.xcodeproj -scheme Sci-Station -configuration Release -showBuildSettings | awk '/ MARKETING_VERSION =/{print $3; exit}')"
          project_build_number="$(xcodebuild -project Sci-Station.xcodeproj -scheme Sci-Station -configuration Release -showBuildSettings | awk '/ CURRENT_PROJECT_VERSION =/{print $3; exit}')"
          [[ "$project_version" == "${RELEASE_TAG#v}" ]]
          if [[ -n "$RELEASE_BUILD_NUMBER" ]]; then
            [[ "$RELEASE_BUILD_NUMBER" =~ ^[0-9]+$ ]]
          else
            RELEASE_BUILD_NUMBER="$project_build_number"
          fi
          Tools/scripts/check-release-build-number.sh "$RELEASE_TAG" "$RELEASE_BUILD_NUMBER"
          echo "SCI_STATION_RESOLVED_BUILD_NUMBER=$RELEASE_BUILD_NUMBER" >>"$GITHUB_ENV"

      - name: Run governance and architecture gates
        run: |
          Tools/scripts/check-appviewmodel-architecture.sh
          Tools/scripts/check-repository-hygiene.sh
          python3 Tools/scripts/check-docs-hygiene.py
          python3 Tools/scripts/check-core-runner-architecture.py
          python3 -m unittest discover -s Tools/tests -v

      - name: Cache pinned Swift style tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.mint
          key: mint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Mintfile') }}

      - name: Install Mint and pinned Swift style tools
        run: |
          brew install mint
          mint bootstrap

      - name: Enforce Swift style gates
        run: |
          SWIFTLINT_BIN="$(mint which realm/SwiftLint@0.65.0 swiftlint)" \
          SWIFTFORMAT_BIN="$(mint which nicklockwood/SwiftFormat@0.62.1 swiftformat)" \
            Tools/scripts/check-swift-style.sh

      - name: Run Swift and Python tests
        run: |
          swift test --enable-code-coverage
          Tools/scripts/check-swift-coverage.sh "$(swift test --show-codecov-path)" 14.0
          swift run SciStationCoreTestRunner
          python -m pip install --disable-pip-version-check -e './AgentRuntime[test,uitest]'
          python -m pytest AgentRuntime/tests

      - name: Build ad-hoc signed release artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          export SCI_STATION_VERSION="${RELEASE_TAG#v}"
          export SCI_STATION_BUILD_NUMBER="$SCI_STATION_RESOLVED_BUILD_NUMBER"
          Tools/scripts/package-release.sh

      - name: Upload release artifacts to workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.dmg_path }}
            ${{ steps.package.outputs.dmg_checksum_path }}
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.zip_checksum_path }}

  minimum-macos-gate:
    name: Verify final DMG on macOS 15
    needs: release-package
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download certificate-free release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          path: release-artifacts

      - name: Verify checksums, bundle integrity, installation, launch, and UI
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release-artifacts -type f -name '*.dmg' -print -quit)"
          checksum_count="$(find release-artifacts -type f -name '*.sha256' | wc -l | tr -d ' ')"
          [[ -n "$dmg_path" ]]
          [[ "$checksum_count" == "2" ]]
          while IFS= read -r checksum_path; do
            (
              cd "$(dirname "$checksum_path")"
              shasum -a 256 -c "$(basename "$checksum_path")"
            )
          done < <(find release-artifacts -type f -name '*.sha256' -print)
          SCI_STATION_VERSION="${RELEASE_TAG#v}" Tools/scripts/verify-release.sh "$dmg_path"
          Tools/scripts/test-release-install.sh "$dmg_path"

  provenance:
    name: Attest gated release provenance
    needs: [release-package, minimum-macos-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download gated release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          path: release-artifacts

      - name: Verify artifact checksums before attestation
        shell: bash
        run: |
          set -euo pipefail
          checksum_count="$(find release-artifacts -type f -name '*.sha256' | wc -l | tr -d ' ')"
          [[ "$checksum_count" == "2" ]]
          while IFS= read -r checksum_path; do
            (
              cd "$(dirname "$checksum_path")"
              shasum -a 256 -c "$(basename "$checksum_path")"
            )
          done < <(find release-artifacts -type f -name '*.sha256' -print)

      - name: Create signed build provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.dmg
            release-artifacts/*.zip

  publish:
    name: Publish GitHub Release
    needs: [release-package, minimum-macos-gate, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRERELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
    steps:
      - name: Download gated release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          path: release-artifacts

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifacts=()
          while IFS= read -r artifact; do
            artifacts+=("$artifact")
          done < <(find release-artifacts -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.sha256' \) \
            -print | sort)
          [[ "${#artifacts[@]}" -eq 4 ]]
          release_notes="Certificate-free macOS distribution. The app is ad-hoc signed and is not Apple-notarized. On first launch macOS may require explicit approval in Privacy & Security. Verify the published SHA-256 or GitHub provenance before opening."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber "${artifacts[@]}"
          else
            release_args=(--verify-tag --generate-notes --title "Sci-Station ${RELEASE_TAG#v}" --notes "$release_notes")
            if [[ "$PRERELEASE" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${artifacts[@]}" "${release_args[@]}"
          fi

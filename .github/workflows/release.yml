name: Public Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.2.0)
        required: true
        type: string
      build_number:
        description: Optional CFBundleVersion override
        required: false
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-package:
    name: Sign, notarize, verify, and stage artifacts
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number || '' }}
    steps:
      - name: Initialize temporary credential paths
        shell: bash
        run: |
          {
            echo "SCI_STATION_RELEASE_CERTIFICATE_PATH=$RUNNER_TEMP/developer-id-application.p12"
            echo "SCI_STATION_NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "SCI_STATION_RELEASE_KEYCHAIN=$RUNNER_TEMP/sci-station-release.keychain-db"
          } >>"$GITHUB_ENV"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@a309ff8f6e9fa5a4b746b1f51a9f48a9cfb14359 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AgentRuntime/pyproject.toml

      - name: Validate release tag and project version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git describe --tags --exact-match)" == "$RELEASE_TAG" ]]
          git merge-base --is-ancestor HEAD origin/main
          python3 Tools/scripts/check-version-consistency.py --tag "$RELEASE_TAG"
          project_version="$(xcodebuild -project Sci-Station.xcodeproj -scheme Sci-Station -configuration Release -showBuildSettings | awk '/ MARKETING_VERSION =/{print $3; exit}')"
          project_build_number="$(xcodebuild -project Sci-Station.xcodeproj -scheme Sci-Station -configuration Release -showBuildSettings | awk '/ CURRENT_PROJECT_VERSION =/{print $3; exit}')"
          [[ "$project_version" == "${RELEASE_TAG#v}" ]]
          if [[ -n "$RELEASE_BUILD_NUMBER" ]]; then
            [[ "$RELEASE_BUILD_NUMBER" =~ ^[0-9]+$ ]]
          else
            RELEASE_BUILD_NUMBER="$project_build_number"
          fi
          Tools/scripts/check-release-build-number.sh "$RELEASE_TAG" "$RELEASE_BUILD_NUMBER"
          echo "SCI_STATION_RESOLVED_BUILD_NUMBER=$RELEASE_BUILD_NUMBER" >>"$GITHUB_ENV"

      - name: Enforce AppViewModel architecture budget
        run: Tools/scripts/check-appviewmodel-architecture.sh

      - name: Run repository and governance gates before credentials
        run: |
          Tools/scripts/check-repository-hygiene.sh
          python3 Tools/scripts/check-docs-hygiene.py
          python3 Tools/scripts/check-core-runner-architecture.py
          python3 -m unittest discover -s Tools/tests -v

      - name: Cache pinned Swift style tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.mint
          key: mint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Mintfile') }}

      - name: Install Mint and pinned Swift style tools
        run: |
          brew install mint
          mint bootstrap

      - name: Enforce Swift style gates
        run: |
          SWIFTLINT_BIN="$(mint which realm/SwiftLint@0.65.0 swiftlint)" \
          SWIFTFORMAT_BIN="$(mint which nicklockwood/SwiftFormat@0.62.1 swiftformat)" \
            Tools/scripts/check-swift-style.sh

      - name: Run Swift Testing suite with coverage
        run: swift test --enable-code-coverage

      - name: Enforce Swift Core coverage baseline
        run: Tools/scripts/check-swift-coverage.sh "$(swift test --show-codecov-path)" 14.0

      - name: Run legacy core runner during migration
        run: swift run SciStationCoreTestRunner

      - name: Install and run Python tests
        run: |
          python -m pip install --disable-pip-version-check -e './AgentRuntime[test,uitest]'
          python -m pytest AgentRuntime/tests

      - name: Import Developer ID certificate and notary API key
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$DEVELOPER_ID_P12_BASE64" && -n "$DEVELOPER_ID_P12_PASSWORD" && -n "$NOTARY_KEY_P8_BASE64" ]]

          keychain_password="$(uuidgen)-$(uuidgen)"

          security delete-keychain "$SCI_STATION_RELEASE_KEYCHAIN" >/dev/null 2>&1 || true
          rm -f "$SCI_STATION_RELEASE_CERTIFICATE_PATH" "$SCI_STATION_NOTARY_KEY_PATH" "$SCI_STATION_RELEASE_KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D >"$SCI_STATION_RELEASE_CERTIFICATE_PATH"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | /usr/bin/base64 -D >"$SCI_STATION_NOTARY_KEY_PATH"
          chmod 600 "$SCI_STATION_RELEASE_CERTIFICATE_PATH" "$SCI_STATION_NOTARY_KEY_PATH"

          security create-keychain -p "$keychain_password" "$SCI_STATION_RELEASE_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SCI_STATION_RELEASE_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SCI_STATION_RELEASE_KEYCHAIN"
          security import "$SCI_STATION_RELEASE_CERTIFICATE_PATH" -k "$SCI_STATION_RELEASE_KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$SCI_STATION_RELEASE_KEYCHAIN"
          security list-keychains -d user -s "$SCI_STATION_RELEASE_KEYCHAIN"

      - name: Build signed and notarized artifacts
        id: package
        shell: bash
        env:
          SCI_STATION_DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          SCI_STATION_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          SCI_STATION_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          SCI_STATION_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          export SCI_STATION_VERSION="${RELEASE_TAG#v}"
          export SCI_STATION_BUILD_NUMBER="$SCI_STATION_RESOLVED_BUILD_NUMBER"
          Tools/scripts/package-release.sh

      - name: Upload release artifacts to workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.dmg_path }}
            ${{ steps.package.outputs.dmg_checksum_path }}
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.zip_checksum_path }}

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$SCI_STATION_RELEASE_KEYCHAIN" >/dev/null 2>&1 || true
          rm -f "$SCI_STATION_RELEASE_CERTIFICATE_PATH" "$SCI_STATION_NOTARY_KEY_PATH" "$SCI_STATION_RELEASE_KEYCHAIN"

  minimum-macos-gate:
    name: Verify final DMG on macOS 15
    needs: release-package
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SCI_STATION_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download signed release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          path: release-artifacts

      - name: Verify checksums, Gatekeeper, installation, launch, and UI
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find release-artifacts -type f -name '*.dmg' -print -quit)"
          checksum_count="$(find release-artifacts -type f -name '*.sha256' | wc -l | tr -d ' ')"
          [[ -n "$dmg_path" ]]
          [[ "$checksum_count" == "2" ]]
          while IFS= read -r checksum_path; do
            (
              cd "$(dirname "$checksum_path")"
              shasum -a 256 -c "$(basename "$checksum_path")"
            )
          done < <(find release-artifacts -type f -name '*.sha256' -print)
          Tools/scripts/verify-release.sh "$dmg_path"
          Tools/scripts/test-release-install.sh "$dmg_path"

  provenance:
    name: Attest gated release provenance
    needs: [release-package, minimum-macos-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download gated release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          path: release-artifacts

      - name: Verify artifact checksums before attestation
        shell: bash
        run: |
          set -euo pipefail
          checksum_count="$(find release-artifacts -type f -name '*.sha256' | wc -l | tr -d ' ')"
          [[ "$checksum_count" == "2" ]]
          while IFS= read -r checksum_path; do
            (
              cd "$(dirname "$checksum_path")"
              shasum -a 256 -c "$(basename "$checksum_path")"
            )
          done < <(find release-artifacts -type f -name '*.sha256' -print)

      - name: Create signed SLSA provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.dmg
            release-artifacts/*.zip

  publish:
    name: Publish GitHub Release
    needs: [release-package, minimum-macos-gate, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRERELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
    steps:
      - name: Download gated release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: Sci-Station-${{ env.RELEASE_TAG }}-macOS-arm64
          path: release-artifacts

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifacts=()
          while IFS= read -r artifact; do
            artifacts+=("$artifact")
          done < <(find release-artifacts -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.sha256' \) \
            -print | sort)
          [[ "${#artifacts[@]}" -eq 4 ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber "${artifacts[@]}"
          else
            release_args=(--verify-tag --generate-notes --title "Sci-Station ${RELEASE_TAG#v}")
            if [[ "$PRERELEASE" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${artifacts[@]}" "${release_args[@]}"
          fi

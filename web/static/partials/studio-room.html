{{define "studioRoom"}}
          <section id="board-workspace" class="board-workspace" aria-label="会议工作区" hidden>
            <div class="room-context" id="chat-header" hidden>
              <div class="room-context-bar">
                <div class="room-heading">
                  <h1 id="view-title" class="view-title"></h1>
                  <span id="meeting-mode-status" class="mode-status" hidden><span class="sr-only">讨论模式：</span><span id="meeting-mode-label"></span><span aria-hidden="true"> · </span><span class="sr-only">，文件权限：</span><span id="meeting-mode-access"></span></span>
                  <span id="session-status" class="session-status" hidden></span>
                </div>
                <button type="button" class="context-trigger" id="participants-toggle" aria-expanded="false" aria-controls="participants-panel"><span id="member-orbit" class="context-avatars" aria-hidden="true"></span><span id="seats-label">席位</span></button>
                <button type="button" class="context-trigger agenda-trigger" id="agenda-toggle" aria-controls="agenda-drawer" aria-expanded="false"><svg class="ui-icon" data-ui-icon="agenda" width="16" height="16" aria-hidden="true"></svg><span>议程</span><span class="context-count" id="agenda-summary"></span></button>
                <button id="progress-toggle" class="context-trigger progress-trigger" type="button" aria-controls="progress-drawer" aria-expanded="false" hidden>推进记录</button>
                <span class="context-state" id="table-center-state"></span>
                <button id="cli-edit-open" class="context-trigger cli-edit-trigger" type="button" aria-haspopup="dialog" aria-controls="cli-edit-dialog" aria-label="CLI 文件编辑" data-en-aria-label="CLI file editing" data-l10n-title="roundtableCLIEdit" hidden><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 7 5 5-5 5m8 0h6"/></svg><span data-en="CLI file editing">CLI 文件编辑</span></button>
              </div>
              <section class="model-read-review" id="studio-read-review" aria-live="polite" hidden></section>
              <section aria-label="圆桌席位" class="context-drawer" id="participants-panel" hidden>
                <div id="member-seats" class="compact-seats"></div>
              </section>
              <section aria-label="会议议程" class="context-drawer" id="agenda-drawer" hidden><div id="meeting-agenda"></div></section>
              <section aria-label="持续推进记录" class="context-drawer" id="progress-drawer" hidden>
                <div class="continuous-status" id="run-continuous-status" role="status" hidden></div>
                <details class="continuous-checkpoint" id="run-continuous-checkpoint" hidden><summary></summary><ul></ul></details>
              </section>
            </div>
            <article id="meeting-board" tabindex="-1" aria-label="共享议题板" hidden></article>
            <section id="room-chat" class="conversation-pane room-chat" aria-label="会议对话与观点" data-en-aria-label="Conversation and viewpoints" hidden>
            <header class="rail-heading">
              <div class="room-panel-tabs" role="tablist" aria-label="会议视图" data-en-aria-label="Meeting views">
                <button id="room-tab-chat" class="room-panel-tab" type="button" role="tab" aria-selected="true" aria-controls="room-panel-chat" tabindex="0"><span data-en="Conversation">会议对话</span></button>
                <button id="room-tab-opinions" class="room-panel-tab" type="button" role="tab" aria-selected="false" aria-controls="meeting-opinions" tabindex="-1"><span data-en="Viewpoints">讨论观点</span><span id="opinions-toggle-count" class="context-count">0</span></button>
              </div>
              <button id="rail-to-board" class="text-button" type="button" data-en="Back to board">返回议题板</button>
            </header>
            <div id="room-panel-chat" class="room-panel-body" role="tabpanel" aria-labelledby="room-tab-chat">
            <div class="page-scroll" id="table-scroll" tabindex="-1">
              <div class="session-content" id="session-content" hidden>
                <div id="chat-board-status"></div>
                <div id="activity-bar" hidden></div>
                <div id="rounds" class="rounds" aria-label="圆桌消息"></div>
                <p id="no-rounds" class="empty-record">
                  点击“开始”，让参与者回应。
                </p>
              </div>
            </div>
            <button
              id="latest-message"
              class="latest-message button secondary small"
              hidden
            >
              查看最新消息 ↓
            </button>
            <form id="run-form" class="composer" hidden>
              <div id="run-materials"></div>
              <div class="composer-surface">
                <div id="run-mention" class="mention-field">
                  <label class="sr-only" for="run-note">发言内容</label>
                  <textarea id="run-note" data-enter-submit="run-submit" rows="2" aria-describedby="run-note-limit run-hint run-mention-status" placeholder="发送消息，输入 @ 点名席位…"></textarea>
                  <div id="run-mention-list" hidden></div>
                </div>
                <span id="run-mention-status" class="composer-recipient" role="status"></span>
                <small id="run-note-limit" class="input-limit" hidden></small>
                <div class="composer-bottom">
                  <button id="run-commands" type="button" aria-label="消息工具" title="消息工具"></button>
                  <span id="run-hint" class="sr-only"></span>
                  <div class="composer-actions">
                    <button id="run-continuous-pause" class="button secondary small" type="button" hidden>暂停持续推进</button>
                    <button
                      id="cancel-run"
                      class="button secondary"
                      type="button"
                      hidden
                    >
                      停止</button
                    ><button id="run-submit" class="button primary" type="submit">
                      开始
                    </button>
                  </div>
                </div>
              </div>
            </form>
            </div>
            <div id="meeting-opinions" class="room-panel-body meeting-opinions" role="tabpanel" aria-labelledby="room-tab-opinions" hidden>
              <div class="meeting-opinions-scroll"><div id="meeting-opinions-list"></div>
                <p id="meeting-opinions-empty" class="quiet" hidden data-en="No published viewpoints yet.">暂无已公开的观点。</p>
              </div>
            </div>
            </section>
          </section>
{{end}}

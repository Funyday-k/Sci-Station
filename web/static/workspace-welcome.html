<!doctype html>
<html lang="{{.Language}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Sci-Station</title>
<link rel="stylesheet" href="/static/workspace-setup.css"><script defer src="/static/workspace-setup.js"></script></head>
<body class="root-welcome"><main><img src="/static/roundtable-mark.png" width="54" height="54" alt=""><h1>Sci-Station</h1>
<p data-zh="请选择已有数据文件夹、空文件夹或默认位置。" data-en="Choose an existing data folder, an empty folder or the default location."></p>
{{if .Message}}<p role="alert">{{.Message}}</p>{{end}}
<div class="root-controls"><button type="button" data-setup="default-storage" data-zh="使用默认位置" data-en="Use default location"></button><button type="button" data-setup="choose-storage" data-zh="选择数据文件夹…" data-en="Choose data folder…"></button></div>
{{if .Message}}<button type="button" data-setup="forget" data-zh="清除最近工作区" data-en="Forget recent workspace"></button>{{end}}
<p role="status" data-root-status></p></main></body></html>

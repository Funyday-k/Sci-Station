{{define "head"}}
<link rel="stylesheet" href="/static/scientific-markdown.css">
  <link rel="stylesheet" href="/static/research.css">
  <link rel="stylesheet" href="/static/research-dashboard.css">
  <script defer src="/static/research-vendor/marked.min.js"></script>
  <script defer src="/static/research-vendor/dompurify.min.js"></script>
  <script defer src="/static/scientific-markdown.js" data-defer-math></script>
  <script defer src="/static/research-graph.js"></script>
  <script defer src="/static/research-inspire-graph.js"></script>
  <script defer src="/static/research-dashboard.js"></script>
  <script defer src="/static/research.js"></script>
  <script defer src="/static/wiki-editor.js"></script>
  <script type="module" src="/static/modules/research/entry.js"></script>
  <script defer src="/static/research-materials.js"></script>
  <script defer src="/static/research-library.js"></script>
  <script defer src="/static/citation-panel.js"></script>
  <link rel="stylesheet" href="/static/citation-panel.css">
{{end}}
{{define "breadcrumb"}}<div id="crumb"><span data-l10n-text="sidebarResearchShell">科研工作台</span></div>{{end}}
{{define "tools"}}<button id="search-open" class="search-open" disabled><span data-icon="search"></span><span data-l10n-text="searchWorkspace">搜索工作区</span><kbd>⌘ K</kbd></button>{{end}}
{{define "content"}}
<div id="shell">
    <div id="workarea">

      <div id="research-loading" class="workspace-page research-load-status">
        <p id="research-loading-message" role="status" data-l10n-text="loadingWorkspace">正在读取工作区…</p>
      </div>
      <main id="main" class="workspace-page" tabindex="-1" aria-busy="true" inert></main>
    </div>
  </div>
  <div id="toast" role="status" hidden></div>
  <dialog id="modal" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2><button id="modal-close" class="icon" type="button" title="关闭" aria-label="关闭" data-l10n-title="close" data-l10n-aria-label="close"><span
          data-icon="close"></span></button>
    </div>
    <div id="dialog-content"></div>
  </dialog>
{{end}}

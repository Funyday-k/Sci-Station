<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{.Title}} · Sci-Station</title>
  <link rel="icon" href="/static/roundtable-mark.png">
  <script src="/static/appearance.js"></script>
  <link rel="stylesheet" href="/static/workspace-theme.css">
  <script defer src="/static/interface-language.js"></script>
  <script defer src="/static/research-modules.js"></script>
  <script defer src="/static/workspace-setup.js"></script>
  <link rel="stylesheet" href="/static/workspace-setup.css">
  <script defer src="/static/ui-icons.js"></script>
  <script defer src="/static/workspace-nav.js"></script>
  <script defer src="/static/model-read-review.js"></script>
  <script defer src="/static/research-evidence.js"></script>
  <script defer src="/static/lab-run.js"></script>
  <script defer src="/static/shell-navigation.js"></script>
  <script defer src="/static/context-rail.js"></script>
  {{template "head" .}}
  <link rel="stylesheet" href="/static/workspace-nav.css">
  <link rel="stylesheet" href="/static/context-rail.css">
</head>
<body data-workspace-surface="{{.Surface}}" data-workspace-layout="{{if .Pane}}pane{{else}}document{{end}}">
  <aside id="workspace-sidebar" class="workspace-sidebar" aria-label="工作区导航" data-l10n-aria-label="workspaceNavigation">
    <div class="workspace-sidebar-heading">
      <a class="workspace-brand" href="/research" aria-label="Sci-Station"><img src="/static/roundtable-mark.png" width="25" height="25" alt=""><span>Sci-Station</span></a>
      <button id="workspace-nav-close" class="workspace-icon" type="button" aria-label="关闭导航" title="关闭导航" data-l10n-aria-label="closeNavigation" data-l10n-title="closeNavigation"><svg class="ui-icon" data-ui-icon="close" aria-hidden="true"></svg></button>
    </div>
    <div class="workspace-sidebar-scroll">
      <nav data-workspace-nav aria-label="工作区" data-l10n-aria-label="toolbarWorkspace"></nav>
      <a data-project-back hidden href="/research"></a>
      <div id="workspace-context" class="workspace-context">{{block "sidebar" .}}{{end}}</div>
    </div>
    <div class="workspace-sidebar-footer">
      <nav data-workspace-settings aria-label="设置" data-l10n-aria-label="routeSettings"></nav>
      {{if .Desktop}}<details class="workspace-roots">
        <summary><svg class="ui-icon" data-ui-icon="folder" aria-hidden="true"></svg><span data-l10n-text="toolbarWorkspace">工作区</span></summary>
        <div><button type="button" data-root-action="open" data-l10n-text="toolbarOpenWorkspace">打开工作区…</button><button type="button" data-root-action="create" data-l10n-text="toolbarCreateWorkspace">创建工作区…</button><button type="button" data-root-action="rename" data-en="Rename workspace…">重命名工作区…</button><button type="button" data-root-action="forget" data-en="Forget recent workspace">清除最近工作区</button><button type="button" data-root-action="reveal" data-l10n-text="revealWorkspace">在 Finder 中显示工作区</button></div>
      </details>{{end}}
    </div>
  </aside>
  <button id="workspace-nav-scrim" type="button" aria-label="关闭导航" data-l10n-aria-label="closeNavigation" tabindex="-1" hidden></button>
  <header class="workspace-bar">
    <button id="workspace-nav-toggle" class="workspace-icon" type="button" aria-controls="workspace-sidebar" aria-expanded="true" aria-label="切换导航" title="切换导航" data-l10n-title="toggleNavigation" data-l10n-aria-label="toggleNavigation"><svg class="ui-icon" data-ui-icon="sidebar" aria-hidden="true"></svg></button>
    <div class="workspace-history">
      <button type="button" class="workspace-icon" data-command="back" aria-label="后退" title="后退" data-l10n-aria-label="back" data-l10n-title="back"><svg class="ui-icon" data-ui-icon="chevronLeft" aria-hidden="true"></svg></button>
      <button type="button" class="workspace-icon" data-command="forward" aria-label="前进" title="前进" data-l10n-aria-label="forward" data-l10n-title="forward"><svg class="ui-icon" data-ui-icon="chevronRight" aria-hidden="true"></svg></button>
    </div>
    <div id="workspace-breadcrumb">{{block "breadcrumb" .}}<span data-workspace-location>{{.Title}}</span>{{end}}</div>
    {{if .AI}}<nav id="workspace-ai-modes" aria-label="AI 模式" data-en-aria-label="AI mode" hidden>
      <a data-ai-mode="single" href="/lab" data-en="Chat">单人对话</a>
      <a data-ai-mode="roundtable" href="/studio" data-en="Roundtable">圆桌讨论</a>
    </nav>{{end}}
    <div id="workspace-tools">{{block "tools" .}}{{end}}</div>
    <div class="shell-rail-controls">
      <button id="shell-assist" class="workspace-icon" type="button" aria-controls="context-rail" aria-pressed="false" aria-label="询问 AI" title="询问 AI" data-l10n-aria-label="askAI" data-l10n-title="askAI"><svg class="ui-icon" data-ui-icon="chat" aria-hidden="true"></svg></button>
    </div>
  </header>
  <div class="workspace-region">{{template "content" .}}</div>
  <div id="shell-divider" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度" tabindex="0" hidden></div>
  <section id="context-rail" aria-labelledby="rail-title" hidden>
    <div class="rail-heading">
      <h2 id="rail-title"></h2>
      <button id="shell-pin" class="workspace-icon" type="button" aria-pressed="false" aria-label="固定侧栏" title="固定侧栏" hidden><svg class="ui-icon" data-ui-icon="pin" aria-hidden="true"></svg></button>
      <button id="rail-close" class="workspace-icon" type="button" aria-label="关闭侧栏" title="关闭侧栏" data-l10n-aria-label="closePanel" data-l10n-title="closePanel"><svg class="ui-icon" data-ui-icon="close" aria-hidden="true"></svg></button>
    </div>
    <p id="rail-context"></p>
    <div id="rail-inspect"></div>
    <div id="rail-ai" hidden>
      <div id="rail-actions"></div>
      <blockquote id="rail-excerpt" hidden></blockquote>
      <label for="rail-prompt" data-en="Message">消息</label>
      <textarea id="rail-prompt" rows="3"></textarea>
      <div class="rail-tools">
        <select id="rail-model" aria-label="模型"></select>
        <select id="rail-effort" aria-label="思考强度"></select>
        <button id="rail-send" type="button" data-en="Send">发送</button>
      </div>
      <section class="model-read-review" id="rail-read-review" aria-live="polite" hidden></section>
      <div id="rail-transcript"></div>
      <div class="rail-tools">
        <button id="rail-retry" type="button" hidden data-en="Reconnect">重新连接</button>
        <button id="rail-stop" type="button" hidden data-en="Stop">停止</button>
        <button id="rail-new" type="button" hidden data-en="New conversation">新会话</button>
        <a id="rail-lab" href="/lab" data-en="Open in AI Lab">在 AI 实验室中打开</a>
      </div>
    </div>
    <p id="rail-status" role="status"></p>
  </section>
</body>
</html>

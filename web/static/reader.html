{{define "head"}}
<link rel="stylesheet" href="/static/reader.css">
<link rel="stylesheet" href="/static/citation-panel.css">
<script defer src="/static/citation-panel.js"></script>
{{end}}
{{define "content"}}
<header class="reader-header">
  <a id="home" href="/research?view=papers" data-l10n-text="openLibrary">返回文献库</a>

  <span class="breadcrumb" data-l10n-text="routePDFReader">文献阅读</span><span class="spacer"></span><button id="citation" type="button" data-citation-paper data-en="Cite paper">引用文献</button><a id="bib" hidden>BibTeX</a><a id="exportMarkdown" hidden data-l10n-text="readerExportMarkdown">导出正文 Markdown</a><a id="original" hidden target="_blank" rel="noopener" data-l10n-text="readerOpenExternal">打开 PDF 原件 ↗</a>
</header>
<section class="titlebar"><div><h1 id="title">论文阅读</h1><p id="byline"></p></div><span class="spacer"></span><button id="handoff" class="primary" disabled data-l10n-text="readerSendSelection">选段入会</button></section>
<div id="message" role="status" aria-live="polite"></div>
<div id="sourceNotice" role="status" hidden></div>
<div id="graphCitation" role="status" hidden></div>
<div class="layout">
 <main class="viewer">
   <div class="toolbar" aria-label="阅读工具" data-l10n-aria-label="readerToolbar">
     <button id="prev" title="上一页" aria-label="上一页" data-l10n-title="readerPrevPage" data-l10n-aria-label="readerPrevPage">‹</button><label class="page-input" for="pageNo"><span data-l10n-text="readerPagePrefix">第</span> <input id="pageNo" type="number" min="1" value="1"> <span data-l10n-text="readerPageSuffix">页</span></label><span id="count"></span><button id="next" title="下一页" aria-label="下一页" data-l10n-title="readerNextPage" data-l10n-aria-label="readerNextPage">›</button>
     <span class="divider"></span><button id="smaller" title="缩小" aria-label="缩小" data-l10n-title="readerZoomOut" data-l10n-aria-label="readerZoomOut">−</button><button id="fit" title="适合宽度" data-l10n-title="readerFitWidth">适宽</button><button id="larger" title="放大" aria-label="放大" data-l10n-title="readerZoomIn" data-l10n-aria-label="readerZoomIn">＋</button>
     <span class="spacer"></span><button id="regionButton" aria-pressed="false" title="框选图表或公式并附上便签" data-l10n-title="readerRegionHelp" data-l10n-text="readerRegionAnnotation">区域批注</button><button id="findButton" aria-expanded="false" data-l10n-text="find">查找</button><button id="reader-inspect" type="button" aria-controls="reader-inspector" aria-expanded="false" data-en="Annotations and notes">批注与笔记</button>
   </div>
   <div id="findBar" hidden><form id="searchForm"><input id="findTerm" type="search" placeholder="查找全文" maxlength="240" aria-label="查找全文" data-l10n-placeholder="readerFindText" data-l10n-aria-label="readerFindText"><button type="submit" data-l10n-text="find">查找</button><button type="button" id="closeFind" aria-label="关闭查找" data-l10n-aria-label="readerCloseFind" data-l10n-text="close">关闭</button></form><div id="findResults"></div></div>
   <div class="viewport" id="viewport"><div id="pageSurface" class="page-surface" hidden><img id="pageImage" alt=""><div id="highlights" class="overlay"></div><div id="textLayer" class="text-layer" aria-label="本页可选取文字" data-l10n-aria-label="readerSelectableText"></div></div><div id="empty" class="empty" role="status">正在打开论文…</div></div>
   <div class="foot"><span id="pageStatus" role="status"></span><span class="spacer"></span><button id="ocr" hidden data-l10n-text="readerTextRecognition">识别此页文字</button><button id="addHighlight" disabled data-l10n-text="readerAddHighlight">添加高亮</button></div>
 </main>
 <aside id="reader-inspector" aria-labelledby="reader-inspector-title" hidden>
   <div class="rail-heading">
     <h2 id="reader-inspector-title" data-en="Annotations and notes">批注与笔记</h2>
     <button id="reader-pin" type="button" aria-pressed="false" aria-label="固定侧栏" title="固定侧栏"><svg class="ui-icon" data-ui-icon="pin" aria-hidden="true"></svg></button>
     <button id="reader-close" type="button" aria-label="关闭" title="关闭" data-l10n-aria-label="close" data-l10n-title="close"><svg class="ui-icon" data-ui-icon="close" aria-hidden="true"></svg></button>
   </div>
   <div role="tablist" class="tabs"><button id="annTab" type="button" role="tab" aria-selected="true" aria-controls="annotPanel" data-l10n-text="toolbarAnnotations">批注</button><button id="notesTab" type="button" role="tab" aria-selected="false" aria-controls="notesPanel" data-l10n-text="readerNotes">论文笔记</button></div>
   <section id="annotPanel" role="tabpanel" aria-labelledby="annTab"><div class="panel-title"><h2 data-l10n-text="readerMyAnnotations">我的批注</h2><span id="annotationCount"></span></div><button id="reloadAnnotations" type="button" hidden data-l10n-text="readerReloadAnnotations">读取最新批注</button><div id="annotations"></div><div id="selectionBox" hidden><h3><span data-l10n-text="readerSelectedPassage">当前选段</span> · <span id="selectionPage"></span></h3><blockquote id="selectedText"></blockquote><label for="comment" data-l10n-text="readerAuthorNote">附注</label><textarea id="comment" rows="3" placeholder="为这段原文留下一条批注" data-l10n-placeholder="readerAnnotationPlaceholder"></textarea><div class="actions"><select id="kind" aria-label="批注类型" data-l10n-aria-label="readerAnnotationType"><option value="highlight" data-l10n-text="readerHighlight">高亮</option><option value="underline" data-l10n-text="readerUnderline">下划线</option><option value="note" data-l10n-text="readerNote">便签</option></select><button id="saveSelection" class="primary">保存批注</button><button id="clearSelection" data-l10n-text="appCancel">取消</button></div></div></section>
   <section id="notesPanel" role="tabpanel" aria-labelledby="notesTab" hidden><div class="panel-title"><h2 data-l10n-text="readerNotes">论文笔记</h2><button id="saveNotes" class="primary" disabled data-l10n-text="toolbarSave">保存</button></div><label class="sr" for="notes" data-l10n-text="readerNotes">论文笔记</label><textarea id="notes" rows="17" placeholder="记录想法、结果和待核对的问题。" data-l10n-placeholder="readerNotePlaceholder"></textarea><p id="notesStatus" role="status" class="muted"></p><button id="reloadNote" hidden data-l10n-text="readerReloadNote">重新读取已保存的版本</button></section>
 </aside>
</div>
<dialog id="handoffDialog"><form method="dialog"><div class="panel-title"><h2 data-l10n-text="readerSendTitle">带选段进入圆桌</h2><button type="button" id="cancelHandoff" aria-label="关闭" data-l10n-aria-label="close">×</button></div><blockquote id="handoffQuote"></blockquote><label for="projectSelect" data-l10n-text="projectNavigation">科研项目</label><select id="projectSelect" required></select><label for="sessionSelect" data-l10n-text="readerTargetMeeting">目标会议</label><select id="sessionSelect"><option value="" data-l10n-text="readerNewTable">新建圆桌</option></select><div class="actions"><button id="submitHandoff" type="button" class="primary" data-l10n-text="readerEnterTable">进入圆桌</button></div></form></dialog>
<script src="/static/reader-graph-source.js" defer></script>
<script src="/static/reader.js" defer></script>
{{end}}
